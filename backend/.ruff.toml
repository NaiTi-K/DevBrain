# Ruff configuration for DevBrain backend

# Maximum line length
line-length = 120

# Target Python 3.11
target-version = "py311"


[lint]
# Enable Pyflakes (F) and pycodestyle (E, W)
select = ["E", "F", "W"]

# Ignore specific rules:
# E701: Multiple statements on one line (colon) - used for clean structure in sandbox parsing
# E402: Module level import not at top of file - common in scripts with dotenv dynamic loads
# E501: Line too long - permitted for long verbose LLM prompt templates and SQL strings
ignore = ["E701", "E402", "E501"]
